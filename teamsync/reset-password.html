<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeamSync — Reset Password</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0d0f14;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1,
    h2,
    h3 {
      font-family: 'Syne', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      justify-content: center;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo span {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #e2e8f0, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(12px);
    }

    .card h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      text-align: center;
    }

    .card p.subtitle {
      color: #64748b;
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #7c3aed;
      background: rgba(124, 58, 237, 0.06);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #f87171;
      display: none;
    }

    .success-msg {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #34d399;
      display: none;
      text-align: center;
    }

    .success-msg a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 700;
    }

    .success-msg a:hover {
      color: #c4b5fd;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" fill="white" viewBox="0 0 24 24">
          <path
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <span>TeamSync</span>
    </div>

    <div class="card">
      <h2>Set New Password</h2>
      <p class="subtitle">Choose a strong password for your account</p>

      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>

      <div id="reset-form">
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input class="form-input" id="new-password" type="password" placeholder="••••••••" required />
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input class="form-input" id="confirm-password" type="password" placeholder="••••••••" required />
        </div>
        <button class="btn-primary" id="reset-btn" onclick="resetPassword()">Update Password</button>
      </div>
    </div>
  </div>

  <script>
    // Extract access_token from URL hash (Supabase redirects with #access_token=...)
    function getTokenFromHash() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    const accessToken = getTokenFromHash();

    if (!accessToken) {
      document.getElementById('error-msg').textContent = 'Invalid or expired reset link. Please request a new one.';
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('reset-form').style.display = 'none';
    }

    async function resetPassword() {
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const btn = document.getElementById('reset-btn');
      const errorEl = document.getElementById('error-msg');
      const successEl = document.getElementById('success-msg');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (!password || password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters';
        errorEl.style.display = 'block';
        return;
      }
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Updating...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: accessToken, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Failed to reset password';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Update Password';
        } else {
          successEl.innerHTML = '✓ ' + data.message + '<br><a href="/login">Go to Sign In →</a>';
          successEl.style.display = 'block';
          document.getElementById('reset-form').style.display = 'none';
        }
      } catch (err) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    }
  </script>
</body>

</html>
