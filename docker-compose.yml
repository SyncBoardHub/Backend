version: '3.8'

services:
  api:
    build: ./backend
    container_name: syncboard-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    networks:
      - syncboard-network

  redis:
    image: redis:alpine
    container_name: syncboard-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - syncboard-network

  nginx:
    image: nginx:alpine
    container_name: syncboard-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - syncboard-network

networks:
  syncboard-network:
    driver: bridge
